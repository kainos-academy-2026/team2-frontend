
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display lint start message
        run: echo "Lint checks started"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Display lint complete message
        run: echo "Lint checks passed"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display test start message
        run: echo "Test checks started"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run unit and API tests
        run: npx vitest run --exclude tests/integration/**

      - name: Display test complete message
        run: echo "Test checks passed"

  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display build start message
        run: echo "Container build started"

      - name: Create placeholder corporate cert for CI build context
        run: |
          mkdir -p docker/certs
          openssl req -x509 -newkey rsa:2048 -sha256 -days 365 -nodes \
            -keyout /tmp/ci-placeholder-ca.key \
            -out docker/certs/corporate-ca-bundle.crt \
            -subj "/CN=ci-placeholder-ca"
          rm -f /tmp/ci-placeholder-ca.key

      - name: Set Docker image tags
        run: |
          echo "ACR_REGISTRY=acraiacademy26.azurecr.io" >> "$GITHUB_ENV"
          echo "ACR_IMAGE=acraiacademy26.azurecr.io/team2-frontend" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_CI=ci-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag "${ACR_IMAGE}:${IMAGE_TAG_SHA}" \
            --tag "${ACR_IMAGE}:${IMAGE_TAG_CI}" \
            .

      - name: Log in to Azure Container Registry
        if: >
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Push image to ACR (main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag "${ACR_IMAGE}:${IMAGE_TAG_SHA}" "${ACR_IMAGE}:latest"
          docker push "${ACR_IMAGE}:${IMAGE_TAG_SHA}"
          docker push "${ACR_IMAGE}:${IMAGE_TAG_CI}"
          docker push "${ACR_IMAGE}:latest"

      - name: Push PR image to ACR (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          docker tag "${ACR_IMAGE}:${IMAGE_TAG_SHA}" "${ACR_IMAGE}:pr-${{ github.event.pull_request.number }}"
          docker push "${ACR_IMAGE}:pr-${{ github.event.pull_request.number }}"

      - name: Display pipeline complete message
        run: echo "Pipeline passed"

  terraform:
    name: Terraform (plan/apply)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [build]
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_environment: dev
      TF_VAR_project_name: team2-frontend
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RG: ${{ secrets.TFSTATE_RESOURCE_GROUP_NAME || secrets.TFSTATE_RG }}
      TFSTATE_STORAGE: ${{ secrets.TFSTATE_STORAGE_ACCOUNT_NAME || secrets.TFSTATE_STORAGE }}
      TFSTATE_CONTAINER: ${{ secrets.TFSTATE_CONTAINER_NAME || secrets.TFSTATE_CONTAINER }}
      TFSTATE_KEY: team2-frontend-dev.tfstate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (remote state)
        working-directory: my-infrastructure
        run: |
          terraform init -input=false -no-color \
            -backend-config="resource_group_name=${TFSTATE_RG}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE}" \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=${TFSTATE_KEY}" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform validate
        working-directory: my-infrastructure
        run: terraform validate

      - name: Terraform plan
        working-directory: my-infrastructure
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: my-infrastructure
        run: terraform apply -input=false -auto-approve
